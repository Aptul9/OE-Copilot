name: Calendar

# Il codice in calendar/server/ va sul server a ogni push su main. I controlli girano in locale prima del push
# (scripts/check.sh calendar), non qui.
on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "calendar/server/**"
      - ".github/workflows/calendar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aggiorna:
    name: Aggiorna il server
    runs-on: ubuntu-latest
    environment: calendar
    # un aggiornamento alla volta, senza interrompere quello in corso
    concurrency:
      group: aggiorna-server
      cancel-in-progress: false
    env:
      SERVER: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
      OE_DIR: /opt/oe-copilot
    steps:
      - uses: actions/checkout@v7

      - name: Generate shared account UI
        run: node shared/sync.mjs

      - name: Chiave SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          # chiave dell'host fissata: niente StrictHostKeyChecking=no
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copia della versione in esecuzione
        run: ssh "$SERVER" "test ! -x $OE_DIR/strumenti/aggiorna_server.sh || $OE_DIR/strumenti/aggiorna_server.sh salva"

      - name: Carica il codice
        run: |
          # caselle, chiave dell'API, dati del telefono, segni di vita e dati
          # dell'interfaccia web restano sul server
          rsync -rlptz --delete \
            --exclude /.env --exclude /agent/fonti.json \
            --exclude /telefono/ --exclude /stato/ --exclude /ui-dati/ --exclude /.versione \
            calendar/server/ "$SERVER:$OE_DIR/"

      - name: Ricostruisci e riavvia
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TEAMS_BROKER_KEY: ${{ secrets.TEAMS_BROKER_KEY }}
        run: |
          # email e password del proprietario, chiave dell'API, segreto dei cookie e chiave stretta di TeamsRelay arrivano dai
          # secret, dallo standard input di SSH (non dalla riga di comando, che si vede in ps): sul server non stanno in nessun
          # file. Se mancano vale ancora il .env.
          printf 'ADMIN_EMAIL=%s\nADMIN_PASSWORD=%s\nAPI_KEY=%s\nBETTER_AUTH_SECRET=%s\nTEAMS_BROKER_KEY=%s\n' \
            "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$API_KEY" "$BETTER_AUTH_SECRET" "$TEAMS_BROKER_KEY" \
            | ssh "$SERVER" "$OE_DIR/strumenti/aggiorna_server.sh avvia ${{ github.sha }}"
