name: Cutover check

# Temporary: before the first deploy from this repository, every secret and variable is compared on the server with
# the value running there. Only names and match/mismatch are printed. Removed after the cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    environment: calendar
    steps:
      - name: Compare
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          h() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          {
            for k in ADMIN_EMAIL ADMIN_PASSWORD BETTER_AUTH_SECRET; do echo "gateway $k $(h "${!k}")"; done
            echo "agent API_KEY $(h "$API_KEY")"
          } | ssh "$TARGET" 'bad=0; while read -r c k s; do l=$(docker exec oe-copilot-$c printenv "$k" | tr -d "\n" | sha256sum | cut -d" " -f1); [ "$l" = "$s" ] && echo "match $c $k" || { echo "MISMATCH $c $k"; bad=1; }; done; exit $bad'

  teams-relay:
    runs-on: ubuntu-latest
    environment: teams-relay
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          FCM_KEY: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          TR_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          TR_APP_URL: ${{ vars.APP_URL }}
          TR_BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TR_SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TR_ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          TR_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TR_MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
          TR_ACCOUNTS_PER_USER: ${{ vars.ACCOUNTS_PER_USER }}
          TR_DESKTOP_USER: ${{ vars.DESKTOP_USER }}
          TR_DESKTOP_PASS: ${{ secrets.DESKTOP_PASS }}
          TR_DESKTOP_URL: ${{ vars.DESKTOP_URL }}
          TR_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          TR_TZ: ${{ vars.TZ }}
          TR_HTTPS_PORT: ${{ vars.HTTPS_PORT }}
          TR_HTTPS_BIND: ${{ vars.HTTPS_BIND }}
          TR_NTFY_ENABLED: ${{ vars.NTFY_ENABLED }}
          TR_NTFY_URL: ${{ vars.NTFY_URL }}
          TR_NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}
          TR_NATIVE_CALLS: ${{ vars.NATIVE_CALLS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          env_sum=$(teams-relay/deploy/render-env.sh | sha256sum | cut -d' ' -f1)
          fcm_sum=$(printf '%s\n' "$FCM_KEY" | sha256sum | cut -d' ' -f1)
          ssh "$TARGET" bash -s -- "$env_sum" "$fcm_sum" <<'SH'
          cd /opt/teamsrelay
          bad=0
          [ "$(sha256sum .env | cut -d' ' -f1)" = "$1" ] && echo "match .env" || { echo "MISMATCH .env"; bad=1; }
          [ "$(sha256sum fcm/service-account.json | cut -d' ' -f1)" = "$2" ] && echo "match fcm/service-account.json" || { echo "MISMATCH fcm/service-account.json"; bad=1; }
          [ "$(cat .fcm-sum)" = "$2" ] && echo "match .fcm-sum" || { echo "MISMATCH .fcm-sum"; bad=1; }
          exit $bad
          SH

  mcp:
    runs-on: ubuntu-latest
    environment: mcp
    steps:
      - name: Compare
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          MCP_HTTP_TOKEN: ${{ secrets.MCP_HTTP_TOKEN }}
          MCP_HTTP_HOSTS: ${{ vars.MCP_HTTP_HOSTS }}
          OUTLOOK_MCP_BROKER_URL: ${{ vars.OUTLOOK_MCP_BROKER_URL }}
          OUTLOOK_MCP_BROKER_KEY: ${{ secrets.API_KEY }}
          OUTLOOK_MCP_TEAMS_URL: ${{ vars.OUTLOOK_MCP_TEAMS_URL }}
          OUTLOOK_MCP_TEAMS_TOKEN: ${{ secrets.MCP_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          for k in MCP_HTTP_TOKEN MCP_HTTP_HOSTS OUTLOOK_MCP_BROKER_URL OUTLOOK_MCP_BROKER_KEY OUTLOOK_MCP_TEAMS_URL OUTLOOK_MCP_TEAMS_TOKEN; do
            echo "$k $(printf '%s' "${!k}" | sha256sum | cut -d' ' -f1)"
          done | ssh "$TARGET" 'bad=0; while read -r k s; do l=$(sed -n "s/^$k=//p" /opt/communication-mcp/.env | tr -d "\n" | sha256sum | cut -d" " -f1); [ "$l" = "$s" ] && echo "match $k" || { echo "MISMATCH $k"; bad=1; }; done; exit $bad'
