[package]
name = "oe-copilot-app"
version = "0.1.0"
description = "Client desktop di OE Copilot"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-notification = "=2.6.0"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-window-state = "=2.5.0"
serde_json = "=1.0.154"

[features]
# Solo per le prove sul PC: aggiunge il comando che fa leggere e girare gli interruttori del menu dell'icona
prova = []

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
