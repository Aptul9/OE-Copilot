[package]
name = "oe-copilot-app"
version = "0.1.0"
description = "Client di OE Copilot per Windows e Android"
edition = "2024"
rust-version = "1.90"

# Il nome della libreria differisce da quello del binario (su Windows i due file si sovrapporrebbero)
[lib]
name = "oe_copilot_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-notification = "=2.6.0"
tauri-plugin-opener = "=2.7.1"
serde_json = "=1.0.154"

# Solo sul PC: icona nell'area di notifica, istanza unica, avvio con Windows, posizione della finestra
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"

[features]
# Solo per le prove sul PC: aggiunge il comando che fa leggere e girare gli interruttori del menu dell'icona
prova = []

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
