[package]
name = "oe-copilot-app"
version = "0.1.0"
description = "Client di OE Copilot per Windows e Android"
edition = "2024"
rust-version = "1.90"

# Il nome della libreria differisce da quello del binario (su Windows i due file si sovrapporrebbero)
[lib]
name = "oe_copilot_app_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-notification = "=2.6.0"
tauri-plugin-opener = "=2.7.1"
serde_json = "=1.0.154"
# Il nucleo dei promemoria (promemoria.rs): le voci verso la pagina e Android, l'ora di Roma con il database dei fusi incluso, così Windows
# e Android danno lo stesso risultato (versioni già nell'albero di tauri)
serde = { version = "=1.0.229", features = ["derive"] }
jiff = { version = "=0.2.38", features = ["tzdb-bundle-always"] }

# Solo su Android: il lavoro in background (Promemoria.kt) chiama il nucleo dei promemoria (versione già nell'albero di wry)
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

# Solo sul PC: icona nell'area di notifica, istanza unica, avvio con Windows, posizione della finestra
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "=2.12.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-window-state = "=2.5.0"

# Solo su Windows: la chiave dell'utente con cui le notifiche dell'eseguibile singolo mostrano il banner (versione già nell'albero di autostart)
# e le notifiche dei promemoria con tag, scadenza e logo (notifica.rs; versioni già nell'albero del plugin notification e di tauri)
[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
base64 = "=0.22.1"

[features]
# Solo per le prove sul PC: aggiunge il comando che fa leggere e cliccare le voci del menu dell'icona
prova = []

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
