[workspace]
resolver = "3"
members = ["nucleo", "rete", "agente"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
oe-nucleo = { path = "nucleo" }
oe-rete = { path = "rete" }
indexmap = "2"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
regex = "1"
ryu-js = "1"
tokio = { version = "1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
