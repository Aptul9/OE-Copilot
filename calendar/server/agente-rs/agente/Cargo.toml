[package]
name = "oe-agente"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "agente"
path = "src/main.rs"

[dependencies]
oe-nucleo.workspace = true
oe-rete.workspace = true
indexmap.workspace = true
jiff.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }
rusqlite = { version = "0.41", features = ["bundled"] }
url = "2"
form_urlencoded = "1"
regex.workspace = true

[dev-dependencies]
sha2 = "0.10"
base64 = "0.22"
regex.workspace = true
