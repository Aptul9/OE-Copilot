[package]
name = "oe-rete"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Riscrive ogni https://<host>/<percorso> in http://127.0.0.1:9000/<host>/<percorso> quando c'e' OE_RETE_PROVA: serve al confronto con l'agente TypeScript.
rete-prova = []

[dependencies]
oe-nucleo.workspace = true
indexmap.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "brotli", "deflate"] }
url = "2"
form_urlencoded = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
