[package]
name = "communication-mcp"
version = "5.0.0"
edition = "2024"
publish = false

[[bin]]
name = "communication-mcp"
path = "src/main.rs"

[features]
# Tests reach fake Outlook, Slack and backends on 127.0.0.1: without this feature the code that allows it is not in the binary.
test-hosts = []

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
form_urlencoded = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
regex = "1"
jiff = { version = "0.2", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
communication-mcp = { path = ".", features = ["test-hosts"] }

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
