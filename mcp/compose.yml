# Remote MCP on the host of OE Copilot and TeamsRelay (README.md, "Remote server"), in their compose project (deploy/stack).
# It joins their networks to reach the OE Copilot agent (agent:8180) and the TeamsRelay web app (webapp:8090) without
# leaving the host, and so that the TeamsRelay Caddy can proxy the public name to it. Secrets and addresses come from .env (.env.example).
name: communication-mcp
services:
  mcp:
    build: .
    image: communication-mcp
    container_name: communication-mcp
    env_file: .env
    environment:
      COMMUNICATION_ID_KEY: ${MCP_HTTP_TOKEN}
    volumes:
      # the slackcli workspace store, kept by the OE autologin (oe-slack) and read by Everflow too
      - /opt/communication-mcp-state/slackcli:/slackcli:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # loopback only: the public name goes through the TeamsRelay Caddy on the shared network
    ports:
      - "127.0.0.1:8190:8190"
    networks:
      - oe_default
      - tr_default
    restart: unless-stopped

# declared as the calendar and TeamsRelay declare them: three stacks, one project on oe-vm (deploy/stack/compose.yml)
networks:
  oe_default:
    name: oe-copilot_default
  tr_default:
    name: teamsrelay_default
