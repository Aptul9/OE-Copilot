# Oe Copilot sulla VM: i calendari si leggono da qui, il browser li chiede qui.
# telefono = Android virtuale con Outlook (caselle Microsoft) e i servizi Google (calendari Google),
# agent = legge il calendario del telefono e lo serve con un'API a chiave.
name: oe-copilot
services:
  # agent = legge il calendario del telefono (agente-ts/, TypeScript) e lo serve con un'API a chiave
  # al gateway (rete di compose) e a chi lo interroga dal server o con un tunnel SSH (README.md, sezione 5).
  # Gira senza privilegi: i file del calendario sono del gruppo 10019 (l'utente di Android che li scrive), che entra come
  # gruppo aggiuntivo; se Android cambia quel numero, in .env si scrive CALENDARIO_GID=<gid dei file di calendar.db> e si ricrea il servizio.
  agent:
    build: ./agente-ts
    container_name: oe-copilot-agent
    user: "10001:10001"
    group_add:
      - "${CALENDARIO_GID:-10019}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./agent/fonti.json:/app/fonti.json:ro
      # Calendario di sistema del telefono, in sola lettura: Outlook e i servizi Google ci
      # copiano i calendari, l'agente ne legge una copia.
      - ./telefono/data/data/com.android.providers.calendar/databases:/android-calendario:ro
      # Segno di vita del servizio che aggiorna il telefono (battito.json).
      - ./stato:/stato:ro
    # Solo localhost: dal PC ci si arriva con un tunnel SSH e il gateway dalla rete di
    # compose, niente è esposto su internet.
    ports:
      - "127.0.0.1:3180:8180"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8180/api/salute').then((r) => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Telefono Android virtuale con le app ufficiali: Outlook per le caselle
  # Microsoft (app di Microsoft, già autorizzata in tutti i tenant: dove
  # TbSync chiede l'approvazione dell'amministratore, Outlook no) e i servizi
  # Google per i calendari Google (Outlook non li esporta nel calendario di
  # Android; l'immagine con i servizi Google si costruisce da immagine-telefono/).
  # Entrambi copiano i calendari nel calendario del telefono, che l'agente legge.
  # Il supervisore li tiene aggiornati a ogni giro, circa ogni 35 secondi
  # (da solo Android sincronizzerebbe ogni 15 minuti).
  # La VM è ARM come i telefoni: Android gira nativo, senza emulazione.
  # Serve il modulo binder_linux caricato sulla VM.
  telefono:
    build: ./immagine-telefono
    image: oe-copilot-telefono
    container_name: oe-copilot-telefono
    privileged: true
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
    volumes:
      - ./telefono/data:/data
    # adb solo su localhost: lo schermo si vede da PC col tunnel SSH.
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped

  # Interfaccia web (facoltativa, README.md 4.7). Gateway (web-ts/, Next.js e Better Auth): pagina di
  # accesso, sessioni, pagina in TypeScript, metodi dell'API e loghi. Senza sessione una pagina rimanda
  # a /login e l'API risponde 401; con la sessione risponde da sé (POST /api/<metodo>, GET /logos/<file>)
  # e il resto è 404. Il proprietario nasce da ADMIN_EMAIL e ADMIN_PASSWORD di .env, le sessioni, il
  # blocco per account e lo stato dell'app stanno in ui-dati/gateway.db. La porta è solo su localhost
  # (per le prove dal server): ci arriva caddy-ui dalla rete di compose.
  gateway:
    build: ./web-ts
    container_name: oe-copilot-gateway
    user: "10001:10001"
    environment:
      - GATEWAY_DB=/dati/gateway.db
      # i metodi dell'API (lib/core) leggono e scrivono la cartella dei dati e chiedono all'agente; i loghi stanno in /dati/logos
      - OE_DATI=/dati
      # l'agente (servizio agent, in TypeScript) sulla rete di compose
      - AGENTE_URL=${AGENTE_URL:-http://agent:8180}
      - AGENTE_CHIAVE=${API_KEY}
      - APP_URL=https://${UI_HOST:-localhost}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # secondo fattore dell'accesso (README.md 4.7): off (predefinito), totp o passkey; un altro valore ferma l'avvio
      - AUTH_2FA=${AUTH_2FA:-off}
      # promemoria dal server (README.md 4.9): il giro è ogni PROMEMORIA_INTERVALLO_S secondi (da 5 a 3600)
      - PROMEMORIA_INTERVALLO_S=${PROMEMORIA_INTERVALLO_S:-30}
      # notifiche del browser (README.md 4.9): la coppia di chiavi VAPID e un contatto (mailto: o https:); vuoti, il canale non è configurato
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    volumes:
      - ./ui-dati:/dati
    ports:
      - "127.0.0.1:3190:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/salute').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Schermo del telefono nel browser (schermo-web/, ws-scrcpy, README.md 4.8): il flusso del video e i tocchi tra il
  # browser e il telefono, con adb sulla rete di compose (telefono:5555). Non è pubblicato su nessuna porta e non ha
  # password: ci arriva solo il Caddy, dopo l'accesso del gateway. adb sul telefono non chiede conferme
  # (ro.adb.secure=0), quindi l'accesso davanti a questo servizio è l'unico cancello.
  schermo:
    build: ./schermo-web
    container_name: oe-copilot-schermo
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # il telefono usa software di disegno: il suo costo si vede nella CPU del telefono, qui basta poco
    cpus: 1.0
    mem_limit: 256m
    pids_limit: 128
    environment:
      - TELEFONO=telefono:5555
      - PAUSA_FILE=/pausa/PAUSA
    volumes:
      # solo questa cartella (di utente 10001, la crea il servizio di sincronizzazione), non tutto stato/ e meno che mai telefono/ (i dati
      # del telefono): finché una pagina guarda il telefono il servizio ci riscrive PAUSA e il servizio di sincronizzazione
      # non porta Outlook in primo piano
      - ./stato/schermo:/pausa
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/salute').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Supervisore del telefono (supervisore/, README.md 4.5 e 6): il giro di sincronizzazione, il battito e il rilevatore degli accessi,
  # con adb sulla rete di compose, senza docker.sock. È l'unico che fa questo lavoro e parte con `docker compose up` come gli altri
  # servizi. Gira come l'utente 10080, quello di Outlook sul telefono: solo lui e root leggono i suoi dati, e stato/ deve essere suo.
  supervisore:
    build: ./supervisore
    container_name: oe-copilot-supervisore
    user: "10080:10080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    environment:
      - TELEFONO=telefono:5555
    volumes:
      # telefono/PAUSA e i dati di Outlook che legge il rilevatore (database e log), in sola lettura
      - ./telefono:/opt/oe-copilot/telefono:ro
      # battito.json, accessi.json, google-sync.json e, da leggere, stato/schermo/PAUSA
      - ./stato:/opt/oe-copilot/stato
    healthcheck:
      # il battito si riscrive ogni 35 secondi circa: più vecchio di 2 minuti vuol dire che il giro non gira
      test: ["CMD", "node", "-e", "process.exit(Date.now() - process.getBuiltinModule('fs').statSync('/opt/oe-copilot/stato/battito.json').mtimeMs < 120000 ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
    restart: unless-stopped

  # HTTPS davanti al gateway. L'indirizzo viene da .env (UI_HOST). Solo localhost: sslh
  # della VM gli gira il TLS del suo nome (SNI) sulla 4445, e da lì passa anche il
  # certificato (TLS-ALPN).
  caddy-ui:
    build: ./caddy-ui
    container_name: oe-copilot-caddy
    environment:
      - UI_HOST=${UI_HOST:-}
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      # certificati e account ACME: non si perdono ricreando il container
      - caddy_dati:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:4445:443"
    restart: unless-stopped

volumes:
  caddy_dati:
  caddy_config:
