# Oe Copilot sulla VM: i calendari si leggono da qui, non piu' dal PC.
# telefono = Android virtuale con Outlook (caselle Microsoft) e i servizi Google (calendari Google),
# agent = legge il calendario del telefono e lo serve all'app del PC.
name: oe-copilot
services:
  # agent = legge il calendario del telefono e lo serve all'app del PC con
  # un'API a chiave.
  agent:
    build: ./agent
    container_name: oe-copilot-agent
    environment:
      - API_KEY=${API_KEY}
    volumes:
      - ./agent/agent.py:/app/agent.py:ro
      - ./agent/comune.py:/app/comune.py:ro
      - ./agent/fonte_android.py:/app/fonte_android.py:ro
      - ./agent/fonti.json:/app/fonti.json:ro
      # Calendario di sistema del telefono, in sola lettura: Outlook e DAVx5 ci
      # copiano le caselle, l'agente ne legge una copia.
      - ./telefono/data/data/com.android.providers.calendar/databases:/android-calendario:ro
      # Segno di vita del servizio che aggiorna il telefono (battito.json).
      - ./stato:/stato:ro
    # Solo localhost: l'app del PC ci arriva con un tunnel SSH, niente e'
    # esposto su internet.
    ports:
      - "127.0.0.1:3180:8180"
    restart: unless-stopped

  # Telefono Android virtuale con le app ufficiali: Outlook per le caselle
  # Microsoft (app di Microsoft, gia' autorizzata in tutti i tenant: dove
  # TbSync chiede l'approvazione dell'amministratore, Outlook no) e i servizi
  # Google per i calendari Google (Outlook non li esporta nel calendario di
  # Android; l'immagine con i servizi Google si costruisce da immagine-telefono/).
  # Entrambi copiano i calendari nel calendario del telefono, che l'agente legge.
  # Il servizio systemd oe-copilot-sincronizza li tiene aggiornati ogni 30 secondi
  # (da solo Android sincronizzerebbe ogni 15 minuti).
  # La VM e' ARM come i telefoni: Android gira nativo, senza emulazione.
  # Serve il modulo binder_linux caricato sulla VM.
  telefono:
    build: ./immagine-telefono
    image: oe-copilot-telefono
    container_name: oe-copilot-telefono
    privileged: true
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
    volumes:
      - ./telefono/data:/data
    # adb solo su localhost: lo schermo si vede da PC col tunnel SSH.
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped

  # Interfaccia web (facoltativa, GUIDA.md 4.7): la stessa pagina e la stessa logica
  # dell'app per Windows, servite al browser. Non è pubblicata e non ha password: ci
  # arriva solo caddy-ui. Le copie del codice dell'app le mette strumenti/prepara_ui.sh.
  ui:
    build: ./ui
    container_name: oe-copilot-ui
    environment:
      - OE_AGENTE_URL=http://agent:8180
      - OE_AGENTE_CHIAVE=${API_KEY}
    volumes:
      # configurazione, interruttori, cache e personalizzazione.json: solo sul server
      - ./ui-dati:/dati
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/salute', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # HTTPS e password (basic auth) davanti a ui. Indirizzo, utente e hash vengono da
  # .env (UI_HOST, UI_USER, UI_HASH). Solo localhost: sslh della VM gli gira il TLS
  # del suo nome (SNI) sulla 4445, e da lì passa anche il certificato (TLS-ALPN).
  caddy-ui:
    build: ./caddy-ui
    container_name: oe-copilot-caddy
    environment:
      - UI_HOST=${UI_HOST:-}
      - UI_USER=${UI_USER:-}
      - UI_HASH=${UI_HASH:-}
    depends_on:
      ui:
        condition: service_healthy
    volumes:
      # certificati e account ACME: non si perdono ricreando il container
      - caddy_dati:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:4445:443"
    restart: unless-stopped

volumes:
  caddy_dati:
  caddy_config:
