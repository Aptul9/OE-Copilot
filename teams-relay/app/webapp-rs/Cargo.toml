[package]
name = "teamsrelay-web"
version = "1.0.0"
edition = "2024"
publish = false

[[bin]]
name = "teamsrelay-web"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "macros", "signal", "sync", "fs"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2"
form_urlencoded = "1"
regex = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
unicode-normalization = "0.1"
getrandom = "0.3"
ring = "0.17"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "tzdb-zoneinfo"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
