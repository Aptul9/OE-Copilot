# Shared Microsoft accounts of the OE calendar agent on the same host (app/src/supervisor/broker.ts): the browsers container
# joins the compose network of OE Copilot to reach the agent (SHARED_BROKER_URL, http://oe-copilot-agent:8180). Only the
# browsers container: the web app stays off it and reaches the agent's list through the supervisor's socket.
# deploy/remote-deploy.sh adds this file when .env sets SHARED_BROKER_URL and the network exists.
services:
  browsers:
    networks:
      desktop: {}
      oe: {}

networks:
  oe:
    name: ${OE_NETWORK:-oe-copilot_default}
    external: true
